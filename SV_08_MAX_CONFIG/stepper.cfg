[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: ^PG13
position_min: -3
position_max: 500
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 7
homing_retract_speed: 15.0
homing_positive_dir: true
position_endstop: 500

[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: ^PG15 
position_min: -1               
position_endstop: 505
position_max: 505
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 7
homing_retract_speed: 15.0

[stepper_z]  #motor3  #z1
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 32 #16
#endstop_pin: ^indxmcu:endstop
endstop_pin: probe: z_virtual_endstop
position_max: 450
position_min: -3.0 #-1.0 #-10
homing_speed: 10.0
homing_retract_dist: 0.0
second_homing_speed: 5.0

[stepper_z1] #z2
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
rotation_distance: 40         
gear_ratio: 80:12            
microsteps: 32 #16    

[stepper_z2]  #z3
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 32 #16

[stepper_z3]  #z4
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 32 #16         
