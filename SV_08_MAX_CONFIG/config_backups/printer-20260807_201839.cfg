[include neopixel.cfg]
[include chamber_heater.cfg]
[include machine.cfg]
[include mainsail.cfg]
[include timelapse.cfg]
[include macro.cfg]
[include fan.cfg]
[include stepper.cfg]
[include tmc.cfg]
[include shaketune.cfg]
#[include klipper_backup.cfg]
#[include bed_screws.cfg]
#[include bed_screws_all.cfg]
[include indx.cfg]
[include indx-tc-macros.cfg]
[include indx-cal.cfg]
[include beacon.cfg]
[skew_correction]
[pause_resume]
recover_velocity: 100.0
[display_status]
[respond]
[exclude_object]

[telemetry]
enabled: True   # Set to False to disable telemetry

[force_move]
enable_force_move: True

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 10800

[save_variables]
filename: /home/pi/printer_data/config/variables.cfg

[gcode_arcs]                       
resolution: 0.1 

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[indx]
mcu: indxmcu

# These are control parameters for the induction heater — leave them at these values
pid_kp: 1.0
pid_ti: 0.0
pid_td: 0.0
pid_b: 1.0

[gcode_button endstop]
pin: ^indxmcu:endstop
press_gcode: {action_respond_info("press")}
release_gcode: {action_respond_info("release")}

[lis2dw]
# Built-in accelerometer on the INDX PCB — used for input shaper calibration
i2c_mcu: indxmcu
i2c_bus: sercom3

[angle indx]
# Magnetic encoder that reads extruder rotation — used for precise extrusion monitoring
sensor_type: as5047d
stepper: extruder
cs_pin: indxmcu:encoder_cs
spi_bus: sercom1

### INDX loadcell ###
[load_cell_probe]
sensor_type: ads131m02
cs_pin: indxmcu:loadcell_cs
spi_bus: sercom1
data_ready_pin: indxmcu:loadcell_drdy
z_offset: 0
channels: 0
force_safety_limit: 0
trigger_force: 150
speed: 2
pullback_distance: 0.2
pullback_speed: 0.3
samples: 1
sample_retract_dist: 0.25
samples_tolerance: 0.05
samples_tolerance_retries: 3
sample_rate: 500
counts_per_gram: 277.46750      # put your own value after calibrationg
reference_tare_counts: -27331   # put your own value after calibrationg

### INDX ###
#[resonance_tester]
#accel_chip: lis2dw
#probe_points:
#    250, 250, 30  
#accel_per_hz: 75

### Beacon ###
[resonance_tester]
accel_chip: beacon
probe_points: 250, 250, 30
accel_per_hz: 75

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
minimum_cruise_ratio: 0.35
max_z_velocity: 25
square_corner_velocity: 6.0
max_z_accel: 300 

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 47.8
damping_ratio_x: 0.04
#max accel 6670
shaper_type_y: mzv
shaper_freq_y: 35.0
damping_ratio_y: 0.047
#max accel 3580

[bed_mesh]
speed: 250
horizontal_move_z: 2.0
algorithm: bicubic 
mesh_min: 33,75
mesh_max: 480,450
probe_count: 50,50
bicubic_tension: 0.2
fade_start: 0.6
fade_end: 10
fade_target: 0
mesh_pps: 5, 5

[quad_gantry_level]
gantry_corners:
	-70,-40
	550,600
points:
    40, 40
    40, 430
    490, 430
    490, 42
speed: 300
horizontal_move_z: 5 #10
retry_tolerance: 0.05
retries: 15
max_adjust: 5 #2 #20

[extruder]
sensor_type: indx
min_temp: 0
min_extrude_temp: 10
max_temp: 350
heater_pin: indx:heater
control: watermark
nozzle_diameter: 0.4
filament_diameter: 1.75
step_pin: indxmcu:motor_step
dir_pin: indxmcu:motor_dir  # If filament feeds backwards, change to: !indxmcu:motor_dir
enable_pin: !indxmcu:motor_enable
microsteps: 32
rotation_distance: 5.7
max_extrude_only_distance: 250
max_extrude_cross_section: 60
pressure_advance: 0.020
pressure_advance_smooth_time: 0.020

[verify_heater extruder]      
max_error: 120                
check_gain_time: 30           
hysteresis: 10              
heating_gain: 2          

[thermistor bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PA1
sensor_type: bed_thermistor  
sensor_pin: PF3 #PC5
max_power: 1.0               
min_temp: 0
max_temp: 110
pwm_cycle_time: 0.3
pid_version: 1
pid_target: 60.00
pid_tolerance: 0.0200
control: pid
pid_kp: 22.994
pid_ki: 0.099
pid_kd: 1340.557

[verify_heater heater_bed]      
max_error: 120                
check_gain_time: 90           
hysteresis: 10               
heating_gain: 1

[led main_led]
white_pin: PA3
cycle_time: 0.010
hardware_pwm: False
initial_WHITE: 0.5

# PID_PROFILE LOAD=bed_60 HEATER=heater_bed
[pid_profile heater_bed bed_60]
pid_version: 1
pid_target: 60.00
pid_tolerance: 0.0200
control: pid
pid_kp: 22.994
pid_ki: 0.099
pid_kd: 1340.557

# PID_PROFILE LOAD=bed_100 HEATER=heater_bed
[pid_profile heater_bed bed_100]
pid_version: 1
pid_target: 100.00
pid_tolerance: 0.0200
control: pid
pid_kp: 53.375
pid_ki: 0.425
pid_kd: 1674.654


